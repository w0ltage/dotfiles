unbind r
bind r source-file $HOME/.config/tmux/tmux.conf
set -g prefix C-a
set -g mouse on
set -g set-clipboard on
setw -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Split windows vertically via '-' and horizontal via '='
unbind-key %
unbind-key '"'
bind-key = split-window -h -c '#{pane_current_path}'
bind-key - split-window -v -c '#{pane_current_path}'

# Set bell/ring enabled
set-window-option -g visual-bell off
set-window-option -g bell-action any

# Don't keep windows around after they exit
set -g remain-on-exit off	

# Count windows from 1
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when some closes
set -g renumber-windows on


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
# Disable tmux2k - we're using native tmux status bar
# set -g @plugin '2KAbhishek/tmux2k'

# GRUVBOX
MESSAGE_BG="#1d2021"
MESSAGE_FG="#eddbb2"
BG="#1d2021"
FG="#eddbb2"
HIGHLIGHT="#fabd2f"

# Title
set -g set-titles on
set -g set-titles-string '#(whoami)@#H - (#S:#W.#P)'

# Panes
set -g pane-border-style fg=default
set -g pane-active-border-style fg=$HIGHLIGHT,bg=default

set -g display-panes-time 1000
set -g display-panes-colour $FG
set -g display-panes-active-colour $HIGHLIGHT

# Mode
set -g mode-style bg=$HIGHLIGHT,fg=$BG

# Status bar position
set -g status-position top
set -g status on
set -g status-interval 5

# Status bar styling - transparent background
set -g status-style "bg=default,fg=white"

# LEFT: Emoji only
set -g status-left "🦅 "
set -g status-left-length 10

# RIGHT: Empty
set -g status-right ""
set -g status-right-length 0

# WINDOW LIST: Format as "1:bash 2:nmap 3:rustc"
setw -g window-status-format "#I:#W "
setw -g window-status-current-format "#[bold,fg=brightwhite]#I:#W#[nobold,fg=white] "
setw -g window-status-separator ""
setw -g window-status-style "bg=default,fg=white"
setw -g window-status-current-style "bg=default,fg=brightwhite,bold"

# Run TPM
run "~/.config/tmux/plugins/tpm/tpm"

set -as terminal-features ',xterm-256color:RGB'
set-option -ga terminal-overrides ',xterm-256color:Tc'
set-option -sa terminal-overrides ',*:setrgbb@:setrgbf@:setb@:setf@'
set -g default-terminal "xterm-256color"

# Add empty line below status bar
set -g status 2
set -g status-format[1] ''

